name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        shell: powershell
        run: ./scripts/package.ps1
      - name: Verify replay parser and HUD rendering
        shell: powershell
        run: |
          $p = Start-Process ./dist/GenevoLauncher.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/GenevoObserver/test-result.txt"
          if ($p.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: genevo-win-x64
          path: artifacts/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/genevo-win-x64.zip artifacts/genevo-win-x64.zip.sha256 --title "Genevo Observer $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $highest = $releases | Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_.tag_name -replace '^v','') } -Descending | Select-Object -First 1
          gh release edit $highest.tag_name --latest
          if ($LASTEXITCODE -ne 0) { throw 'Latest release update failed' }
